<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1714"/>
      <stop offset="1" stop-color="#2a211b"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="1" stop-color="#f0a47f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>

  <!-- before: context grows every turn -->
  <g transform="translate(690 300)">
    <g fill="#4a3f37">
      <rect x="0"   y="-40"  width="34" height="40"  rx="5"/>
      <rect x="44"  y="-70"  width="34" height="70"  rx="5"/>
      <rect x="88"  y="-105" width="34" height="105" rx="5"/>
      <rect x="132" y="-145" width="34" height="145" rx="5"/>
      <rect x="176" y="-190" width="34" height="190" rx="5"/>
      <rect x="220" y="-235" width="34" height="235" rx="5"/>
    </g>
    <!-- after: clear/compact keeps it low -->
    <g fill="url(#hot)">
      <rect x="290" y="-40" width="34" height="40" rx="5"/>
      <rect x="334" y="-70" width="34" height="70" rx="5"/>
      <rect x="378" y="-45" width="34" height="45" rx="5"/>
      <rect x="422" y="-75" width="34" height="75" rx="5"/>
    </g>
    <text x="127" y="34" fill="#8b7d72" font-size="16" text-anchor="middle">sin token-saver</text>
    <text x="373" y="34" fill="#f0a47f" font-size="16" text-anchor="middle">con token-saver</text>
  </g>

  <text x="64" y="128" fill="#f5efe9" font-size="64" font-weight="700" letter-spacing="-1.5">token-saver</text>
  <text x="66" y="178" fill="#c9bcb1" font-size="24">Gasta menos tokens en Claude Code</text>
  <text x="66" y="210" fill="#c9bcb1" font-size="24">y haz que tu suscripción dure más.</text>
  <g font-size="17" fill="#f0a47f">
    <text x="66" y="276">● avisos de contexto   ● salidas compactas</text>
    <text x="66" y="304">● agente barato   ● auditoría de consumo</text>
  </g>
</svg>

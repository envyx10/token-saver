<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .bg { fill: #ffffff; } .ink { fill: #1f1b18; } .muted { fill: #6b625b; } .grid { stroke: #e6e0da; }
    .bar { fill: #c9bcb1; } .hot { fill: #d97757; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; } .ink { fill: #f0f6fc; } .muted { fill: #9198a1; } .grid { stroke: #30363d; }
      .bar { fill: #4a4440; }
    }
  </style>
  <rect class="bg" width="800" height="340" rx="12"/>
  <text class="ink" x="32" y="40" font-size="18" font-weight="600">Contexto procesado en cada mensaje de una sesión larga</text>
  <text class="muted" x="32" y="64" font-size="14">Cada barra es lo que se vuelve a procesar al enviar ese mensaje</text>

  <!-- grid: y=280 is 0, 1k tokens = 0.2px; 900k = 180px -->
  <g class="grid" stroke-width="1">
    <line x1="90" y1="280" x2="770" y2="280"/>
    <line x1="90" y1="220" x2="770" y2="220" stroke-dasharray="4 4"/>
    <line x1="90" y1="160" x2="770" y2="160" stroke-dasharray="4 4"/>
    <line x1="90" y1="100" x2="770" y2="100" stroke-dasharray="4 4"/>
  </g>
  <g class="muted" font-size="12" text-anchor="end">
    <text x="80" y="284">0</text>
    <text x="80" y="224">300k</text>
    <text x="80" y="164">600k</text>
    <text x="80" y="104">900k</text>
  </g>

  <!-- bars: 20k, 60k, 120k, 250k, 480k, 850k -->
  <g>
    <rect class="bar" x="120" y="276" width="70" height="4" rx="3"/>
    <rect class="bar" x="230" y="268" width="70" height="12" rx="3"/>
    <rect class="bar" x="340" y="256" width="70" height="24" rx="3"/>
    <rect class="bar" x="450" y="230" width="70" height="50" rx="3"/>
    <rect class="hot" x="560" y="184" width="70" height="96" rx="3"/>
    <rect class="hot" x="670" y="110" width="70" height="170" rx="3"/>
  </g>
  <g class="ink" font-size="13" font-weight="600" text-anchor="middle">
    <text x="155" y="268">20k</text>
    <text x="265" y="260">60k</text>
    <text x="375" y="248">120k</text>
    <text x="485" y="222">250k</text>
    <text x="595" y="176">480k</text>
    <text x="705" y="102">850k</text>
  </g>
  <g class="muted" font-size="13" text-anchor="middle">
    <text x="155" y="304">mensaje 1</text>
    <text x="265" y="304">5</text>
    <text x="375" y="304">10</text>
    <text x="485" y="304">20</text>
    <text x="595" y="304">40</text>
    <text x="705" y="304">80</text>
  </g>
  <text class="muted" x="650" y="328" font-size="12" text-anchor="middle">aquí token-saver ya te habría avisado</text>
</svg>
